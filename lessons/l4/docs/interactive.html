<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L4 — Сохранение черновика</title><style>body{font:18px/1.5 system-ui;max-width:880px;margin:auto;padding:24px;background:#edf5f2;color:#172e35}section{padding:20px;background:white;border-radius:10px;margin:20px 0}textarea{width:95%;min-height:110px;font:inherit}button{font:inherit;margin:5px;padding:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><p><a href="../README.md">Задание</a> · <a href="GUIDE.md">Гайд</a></p><h1>Заметка и хранилище</h1><p>Небольшой пример заметки с версией формата. Он хранит только собственный ключ l4-note-demo. Обработка начинается после явного действия.</p>
<section><h2>Переход состояния</h2><label>Текст заметки<textarea id="answer"></textarea></label><button id="save">Изменить ответ</button><button id="submit">Завершить</button><button id="reset">Сбросить</button><pre id="state"></pre></section>
<section><h2>Чтение и проверка</h2><button id="restore">Восстановить</button><button id="corrupt">Повредить хранилище</button><button id="incompatible">Другая версия</button><label><input id="deny" type="checkbox">Симулировать отказ хранилища</label><p id="message" aria-live="polite"></p></section>
<script>
const $=id=>document.getElementById(id),key='l4-note-demo';const fresh=()=>({version:1,text:'',status:'in-progress'});let state=fresh();
function reducer(s,a){if(a.type==='reset')return fresh();if(s.status==='submitted')return s;if(a.type==='changed')return {...s,text:a.text};if(a.type==='submit')return {...s,status:'submitted'};return s}
function storage(){if($('deny').checked)throw Error('storage unavailable');return localStorage}
function render(){$('answer').value=state.text;$('answer').disabled=state.status==='submitted';$('save').disabled=state.status==='submitted';$('submit').disabled=state.status==='submitted';$('state').textContent=JSON.stringify(state,null,2)}
function persist(){try{storage().setItem(key,JSON.stringify(state));$('message').textContent='Состояние сохранено.'}catch{$('message').textContent='Запись недоступна. Изменение осталось в памяти.'}}
$('save').onclick=()=>{state=reducer(state,{type:'changed',text:$('answer').value});persist();render()};$('submit').onclick=()=>{state=reducer(state,{type:'changed',text:$('answer').value});state=reducer(state,{type:'submit'});persist();render()};
$('restore').onclick=()=>{try{const raw=storage().getItem(key);if(raw===null){$('message').textContent='Сохранённой заметки нет.';return}const v=JSON.parse(raw);if(!v||typeof v!=='object'||Array.isArray(v)||v.version!==1||typeof v.text!=='string'||!['in-progress','submitted'].includes(v.status)){throw Error('invalid')}state={version:1,text:v.text,status:v.status};$('message').textContent='Заметка восстановлена.';render()}catch{$('message').textContent='Чтение невозможно или формат несовместим. Текущее состояние не изменено; доступен явный сброс.'}};
function writeBad(value){try{storage().setItem(key,value);$('message').textContent='Учебные данные записаны. Нажмите «Восстановить».'}catch{$('message').textContent='Хранилище недоступно; данные не записаны.'}}
$('corrupt').onclick=()=>writeBad('{');$('incompatible').onclick=()=>writeBad(JSON.stringify({version:2,text:'старый формат',status:'in-progress'}));$('reset').onclick=()=>{state=reducer(state,{type:'reset'});try{storage().removeItem(key);$('message').textContent='Состояние и сохранённая заметка сброшены.'}catch{$('message').textContent='Сброшена память; хранилище сейчас недоступно.'}render()};render();
</script></body></html>
