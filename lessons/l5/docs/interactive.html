<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L5 — HTTP и попытка</title><style>body{font:18px/1.5 system-ui;max-width:900px;margin:auto;padding:24px;background:#eef3f7;color:#182c36}section{background:white;padding:24px;margin:20px 0;border-radius:12px}button,input{font:inherit;padding:9px;margin:5px;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eaf0f3;padding:15px}</style></head><body><p><a href="../README.md">Задание</a> · <a href="GUIDE.md">Гайд</a></p><h1>HTTP и состояние попытки</h1><p>Локальная симуляция. Реальных запросов нет; для Network используйте сервер и примеры из гайда.</p>
<section><h2>Response и ошибка</h2><button id="ok">Симулировать 200</button><button id="fail">Симулировать 500</button><pre id="status">Ответ ещё не получен.</pre></section>
<section><h2>PUT и DELETE</h2><label>Черновик<input id="text" value="первый ответ"></label><label><input type="checkbox" id="reject">Ошибка сохранения</label><button id="put">Сохранить</button><button id="del">DELETE</button><pre id="answer">Подтверждённого ответа нет.</pre></section>
<section><h2>submit и result</h2><button id="submit">Завершить</button><button id="reset">Новая попытка</button><pre id="result">Attempt: in-progress</pre></section>
<script>
const $=id=>document.getElementById(id);let state={answer:null,status:'in-progress',result:null};$('ok').onclick=()=>{$('status').textContent='HTTP 200: response.ok = true; тело ещё нужно прочитать и проверить.'};$('fail').onclick=()=>{$('status').textContent='HTTP 500: response.ok = false. Это Response, а не отказ Promise fetch по причине сети.'};
function gate(){if(state.status==='submitted'){$('answer').textContent='HTTP 409: завершённую попытку изменять нельзя.';return false}if($('reject').checked){$('answer').textContent='HTTP 500: введённый текст остался в поле, подтверждение не изменилось.';return false}return true}
$('put').onclick=()=>{if(!gate())return;state.answer={taskId:'demo-text',kind:'short-text',text:$('text').value};$('answer').textContent=JSON.stringify(state.answer,null,2)+'\nСохранение подтверждено.'};$('del').onclick=()=>{if(!gate())return;state.answer=null;$('answer').textContent='Ответ удалён; повторный DELETE допустим.'};$('submit').onclick=()=>{if(!state.result){const pending=Boolean(state.answer?.text.trim());state.status='submitted';state.result={status:pending?'pending-review':'graded',score:pending?null:0,maxScore:1};}$('result').textContent='Attempt: submitted\n'+JSON.stringify(state.result,null,2)+'\nПовтор возвращает тот же результат.'};$('reset').onclick=()=>{state={answer:null,status:'in-progress',result:null};$('result').textContent='Attempt: in-progress';$('answer').textContent='Подтверждённого ответа нет.';$('text').value='';$('reject').checked=false};
</script></body></html>
